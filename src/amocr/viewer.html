<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Viewer</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
  --accent: #2f6fd6; --low: #fff1c7; --low-text: #6a4b00; --hl: rgba(47,111,214,.18); --hl-border: #2f6fd6;
  --del: #fbd9d6; --del-text: #8a1c12; --ins: #d4f0dc; --ins-text: #12602d;
  --header: #ece9f7; --verse: #e3eefc; --commentary: transparent; --footnote: #f1f0ea; --signature: #f1f0ea; --other: #f1f0ea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --text: #e8e6e1; --muted: #9a9890; --line: #33322f;
    --accent: #7aa7f0; --low: #4a3a0c; --low-text: #f3d68a; --hl: rgba(122,167,240,.22); --hl-border: #7aa7f0;
    --del: #5a1f1a; --del-text: #ffb4ab; --ins: #173f25; --ins-text: #a6e5b8;
    --header: #2c2840; --verse: #1d2b40; --footnote: #2a2926; --signature: #2a2926; --other: #2a2926;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --text: #e8e6e1; --muted: #9a9890; --line: #33322f;
  --accent: #7aa7f0; --low: #4a3a0c; --low-text: #f3d68a; --hl: rgba(122,167,240,.22); --hl-border: #7aa7f0;
  --del: #5a1f1a; --del-text: #ffb4ab; --ins: #173f25; --ins-text: #a6e5b8;
  --header: #2c2840; --verse: #1d2b40; --footnote: #2a2926; --signature: #2a2926; --other: #2a2926;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
.deva { font-family: "Kohinoor Devanagari", "Devanagari Sangam MN", "Nirmala UI", "Mangal", "Noto Sans Devanagari", "Lohit Devanagari", sans-serif; font-size: 17px; line-height: 1.8; }
header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
select, button, input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.grow { flex: 1; }
.muted { color: var(--muted); }
main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { overflow: auto; min-height: 0; }
#imgpane { background: var(--bg); border-right: 1px solid var(--line); }
#imgwrap { position: relative; margin: 12px auto; }
#imgwrap img { display: block; width: 100%; height: auto; background: #fff; }
#box { position: absolute; border: 2px solid var(--hl-border); background: var(--hl); pointer-events: none; display: none; border-radius: 2px; }
#textpane { background: var(--panel); padding: 12px 20px 40px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 10px; font-size: 13px; }
.ln { padding: 0 6px; border-radius: 4px; white-space: pre-wrap; }
.ln:hover { background: var(--hl); }
.ln.low { background: var(--low); color: var(--low-text); }
.gap { height: 10px; }
.region { border-radius: 6px; padding: 4px 6px; margin: 6px 0; }
.region .tag { font: 11px/1 -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 2px 0 4px; }
.r-header { background: var(--header); } .r-verse { background: var(--verse); } .r-commentary { background: var(--commentary); border: 1px solid var(--line); }
.r-footnote, .r-signature, .r-other { background: var(--footnote); }
.diff { white-space: pre-wrap; }
.diff del { background: var(--del); color: var(--del-text); text-decoration: line-through; }
.diff ins { background: var(--ins); color: var(--ins-text); text-decoration: none; }
textarea { width: 100%; min-height: 70vh; resize: vertical; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
details { margin-top: 16px; font-size: 13px; }
details li { margin: 2px 0; }
.legend span { display: inline-block; padding: 0 6px; border-radius: 4px; margin-right: 4px; font-size: 12px; }
#status { font-size: 13px; }
/* Proofread editor: a highlight layer drawn line for line behind a transparent textarea. */
.ed { position: relative; --lh: 31px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.ed textarea, #hl { font-size: 17px; line-height: var(--lh); padding: 10px; margin: 0; border: 0; white-space: pre; tab-size: 4; overflow-wrap: normal; }
.ed textarea { position: relative; display: block; width: 100%; min-height: 70vh; resize: vertical; background: transparent; border-radius: 6px; }
#hl { position: absolute; inset: 0; overflow: hidden; color: transparent; pointer-events: none; padding-bottom: 80px; }
#hl > div { height: var(--lh); border-radius: 3px; }
#hl .lowl { background: var(--low); }
#hl .cur { box-shadow: inset 3px 0 0 var(--accent); }
#hl .cur:not(.lowl) { background: var(--hl); }
.pal { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
.pal button { padding: 1px 8px; min-width: 30px; font-size: 16px; }
.rom { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
#rom { flex: 1; min-width: 200px; }
#romout { min-width: 6em; font-size: 17px; }
.keys { font-size: 12px; margin: 6px 0 0; }
.keys kbd { font: 11px/1 -apple-system, sans-serif; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; background: var(--bg); }
.sg { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; cursor: pointer; }
.sg.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--hl); }
.sg img { display: block; max-width: 100%; margin: 4px 0; background: #fff; }
.sg del { background: var(--del); color: var(--del-text); }
.sg ins { background: var(--ins); color: var(--ins-text); text-decoration: none; }
.rules { font-size: 13px; border-collapse: collapse; width: 100%; }
.rules td { border-bottom: 1px solid var(--line); padding: 2px 6px; vertical-align: top; }
.draftnote { background: var(--low); color: var(--low-text); border-radius: 6px; padding: 4px 8px; margin-bottom: 8px; font-size: 13px; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } #imgpane { border-right: 0; border-bottom: 1px solid var(--line); max-height: 50vh; } header { padding: 8px 16px; } }
</style>
</head>
<body>
<header>
  <h1>OCR Viewer</h1>
  <select id="work" aria-label="Work"></select>
  <button id="prev" title="Previous page (←)">◀</button>
  <select id="page" aria-label="Page"></select>
  <button id="next" title="Next page (→)">▶</button>
  <span class="muted">zoom</span><input id="zoom" type="range" min="40" max="250" value="100" aria-label="Image zoom">
  <span class="grow"></span>
  <button id="theme" title="Toggle theme">◐</button>
</header>
<header>
  <button id="m-view" class="on">View</button>
  <button id="m-diff">Compare</button>
  <button id="m-edit">Proofread</button>
  <button id="m-sugg" title="Fixes learned from corrections, suggested across the book">Suggestions</button>
  <select id="engA" aria-label="Output"></select>
  <span id="vs" class="muted">vs</span>
  <select id="engB" aria-label="Compare against"></select>
  <span class="grow"></span>
  <span id="status" class="muted"></span>
</header>
<main>
  <div class="pane" id="imgpane"><div id="imgwrap"><img id="img" alt="Page scan"><div id="box"></div></div></div>
  <div class="pane" id="textpane"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const S = { work: null, page: null, pages: [], data: null, mode: "view" };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (u, opt) => { const r = await fetch(u, opt); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };
const LOW = 70;

function setTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
setTheme(store.get("theme"));
$("theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const t = cur === "dark" ? "light" : "dark"; setTheme(t); store.set("theme", t); };

$("zoom").value = store.get("zoom") || 100;
const applyZoom = () => { $("imgwrap").style.width = $("zoom").value + "%"; store.set("zoom", $("zoom").value); };
$("zoom").oninput = applyZoom; applyZoom();

async function init() {
  const works = await api("/api/works");
  $("work").innerHTML = works.map((w) => `<option value="${esc(w.id)}">${esc(w.id)} · ${esc(w.title)}</option>`).join("");
  const [hw, hp] = location.hash.slice(1).split("/");
  if (hw && works.some((w) => w.id === hw)) $("work").value = hw;
  await loadWork(hp ? +hp : null);
}

async function loadWork(page) {
  S.work = $("work").value;
  S.pages = await api(`/api/${S.work}/pages`);
  if (!S.pages.length) { $("textpane").innerHTML = `<p class="muted">No OCR results yet. Run <code>uv run amocr ocr ${esc(S.work)} --pages 51</code>.</p>`; return; }
  $("page").innerHTML = S.pages.map((p) => `<option value="${p.page}">p${p.page} · ${p.engines.length} output${p.engines.length === 1 ? "" : "s"}${p.groundtruth ? " · GT" : ""}</option>`).join("");
  const want = S.pages.find((p) => p.page === page) ? page : S.pages[0].page;
  await loadPage(want);
}

async function loadPage(page) {
  S.page = page; $("page").value = page;
  history.replaceState(null, "", `#${S.work}/${page}`);
  $("img").src = `/img/${S.work}/${page}`;
  $("box").style.display = "none";
  S.data = await api(`/api/${S.work}/${page}`);
  const labels = Object.keys(S.data.results);
  const order = (l) => (l === "groundtruth" ? "0" : l.startsWith("claude") ? "1" + l : "2" + l);
  labels.sort((a, b) => order(a).localeCompare(order(b)));
  const opt = (l) => `<option value="${esc(l)}">${esc(l === "groundtruth" ? "ground truth" : l)}${S.data.results[l].cer != null ? " · CER " + (S.data.results[l].cer * 100).toFixed(1) + "%" : ""}</option>`;
  const keepA = $("engA").value, keepB = $("engB").value;
  $("engA").innerHTML = labels.map(opt).join("");
  $("engB").innerHTML = labels.map(opt).join("");
  const firstEngine = labels.find((l) => l !== "groundtruth") || labels[0];
  $("engA").value = labels.includes(keepA) ? keepA : (store.get("engA") && labels.includes(store.get("engA")) ? store.get("engA") : firstEngine);
  $("engB").value = labels.includes(keepB) && keepB !== $("engA").value ? keepB : (labels.includes("groundtruth") ? "groundtruth" : labels.find((l) => l !== $("engA").value) || labels[0]);
  render();
}

function setMode(m) { S.mode = m; for (const k of ["view", "diff", "edit", "sugg"]) $("m-" + k).classList.toggle("on", k === m); render(); }
$("m-view").onclick = () => setMode("view");
$("m-diff").onclick = () => setMode("diff");
$("m-edit").onclick = () => setMode("edit");
$("m-sugg").onclick = () => setMode("sugg");
$("engA").onchange = () => { store.set("engA", $("engA").value); render(); };
$("engB").onchange = render;
$("work").onchange = () => loadWork(null);
$("page").onchange = () => loadPage(+$("page").value);
const step = (d) => { const i = S.pages.findIndex((p) => p.page === S.page); const n = S.pages[i + d]; if (n) loadPage(n.page); };
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
document.addEventListener("keydown", (e) => { if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || S.mode === "sugg") return; if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });

function showBox(bbox) {
  const img = $("img"); if (!bbox || !img.naturalWidth) return;
  const s = img.clientWidth / img.naturalWidth, b = $("box");
  Object.assign(b.style, { display: "block", left: bbox[0] * s - 3 + "px", top: bbox[1] * s - 3 + "px", width: (bbox[2] - bbox[0]) * s + 6 + "px", height: (bbox[3] - bbox[1]) * s + 6 + "px" });
}
function scrollToBox(bbox) { const img = $("img"); if (!bbox || !img.naturalWidth) return; const s = img.clientWidth / img.naturalWidth; const pane = $("imgpane"); const y = bbox[1] * s; if (y < pane.scrollTop + 40 || y > pane.scrollTop + pane.clientHeight - 60) pane.scrollTo({ top: y - pane.clientHeight / 3, behavior: "smooth" }); }

function metaLine(r) {
  const bits = [];
  if (r.engine) bits.push(`<span><b>${esc(r.engine)}</b> ${esc(r.engine_version || "")}</span>`);
  if (r.config) bits.push(`<span class="muted">${esc(JSON.stringify(r.config))}</span>`);
  if (r.confidence != null) bits.push(`<span>mean conf ${r.confidence}</span>`);
  if (r.cer != null) bits.push(`<span>CER vs ground truth <b>${(r.cer * 100).toFixed(2)}%</b></span>`);
  return `<div class="meta">${bits.join("")}</div>`;
}

function renderView(label) {
  const r = S.data.results[label];
  let h = metaLine(r);
  for (const w of r.warnings || []) h += `<div class="ln low">⚠ ${esc(w)}</div>`;
  h += `<div class="deva">`;
  const lines = r.lines || [];
  if (lines.length && lines[0].type) {
    let cur = null;
    lines.forEach((ln) => {
      const key = ln.type + "|" + (ln.verse ?? "");
      if (key !== cur) { if (cur) h += `</div>`; h += `<div class="region r-${esc(ln.type)}"><div class="tag">${esc(ln.type)}${ln.verse ? " · v" + esc(ln.verse) : ""}</div>`; cur = key; }
      h += `<div class="ln">${esc(ln.text)}</div>`;
    });
    if (cur) h += `</div>`;
  } else if (lines.length && lines[0].bbox) {
    h = h.replace('<div class="deva">', `<div class="legend muted" style="margin-bottom:8px"><span class="ln low">conf &lt; ${LOW}</span> hover a line to find it on the page</div><div class="deva">`);
    let prev = null;
    lines.forEach((ln, i) => {
      const para = ln.block + "." + ln.par;
      if (prev && para !== prev) h += `<div class="gap"></div>`;
      prev = para;
      h += `<div class="ln${ln.conf < LOW ? " low" : ""}" data-i="${i}" title="conf ${ln.conf}">${esc(ln.text)}</div>`;
    });
  } else {
    h += r.text.split("\n").map((t) => (t.trim() ? `<div class="ln">${esc(t)}</div>` : `<div class="gap"></div>`)).join("");
  }
  h += `</div>`;
  if (r.changes && r.changes.length) h += `<details open><summary>${r.changes.length} changes from Tesseract</summary><ul class="deva" style="font-size:15px">${r.changes.map((c) => `<li><del style="color:var(--del-text)">${esc(c.from)}</del> → <b>${esc(c.to)}</b> <span class="muted" style="font-size:12px">${esc(c.why || "")}</span></li>`).join("")}</ul></details>`;
  if (r.uncertain && r.uncertain.length) h += `<details open><summary>${r.uncertain.length} uncertain readings</summary><ul class="deva" style="font-size:15px">${r.uncertain.map((u) => `<li>${esc(u)}</li>`).join("")}</ul></details>`;
  $("textpane").innerHTML = h;
  if (lines.length && lines[0].bbox) {
    $("textpane").querySelectorAll(".ln[data-i]").forEach((el) => {
      const bb = lines[+el.dataset.i].bbox;
      el.onmouseenter = () => showBox(bb);
      el.onmouseleave = () => ($("box").style.display = "none");
      el.onclick = () => { showBox(bb); scrollToBox(bb); };
    });
  }
}

async function renderDiff(a, b) {
  if (a === b) { $("textpane").innerHTML = `<p class="muted">Pick two different outputs to compare.</p>`; return; }
  $("textpane").innerHTML = `<p class="muted">Comparing…</p>`;
  const d = await api(`/api/${S.work}/${S.page}/diff?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
  const name = (l) => (l === "groundtruth" ? "ground truth" : l);
  let h = `<div class="meta"><span><del style="background:var(--del);color:var(--del-text)">${esc(name(a))}</del> → <ins style="background:var(--ins);color:var(--ins-text);text-decoration:none">${esc(name(b))}</ins></span><span>CER <b>${(d.cer * 100).toFixed(2)}%</b> (${esc(name(a))} against ${esc(name(b))})</span></div><div class="deva diff">`;
  for (const [op, x, y] of d.ops) {
    if (op === "equal") h += esc(x);
    else { if (x) h += `<del>${esc(x)}</del>`; if (y) h += `<ins>${esc(y)}</ins>`; }
  }
  $("textpane").innerHTML = h + `</div>`;
}

// Romanised (IAST or Harvard-Kyoto) to Devanagari, for typing short insertions.
const translit = (() => {
  const V = [["ai", "ऐ", "ै"], ["au", "औ", "ौ"], ["aa", "आ", "ा"], ["ii", "ई", "ी"], ["uu", "ऊ", "ू"], ["RR", "ॠ", "ॄ"], ["lR", "ऌ", "ॢ"],
    ["r̥̄", "ॠ", "ॄ"], ["r̥", "ऋ", "ृ"], ["l̥", "ऌ", "ॢ"], ["a", "अ", ""], ["A", "आ", "ा"], ["ā", "आ", "ा"], ["i", "इ", "ि"], ["I", "ई", "ी"], ["ī", "ई", "ी"],
    ["u", "उ", "ु"], ["U", "ऊ", "ू"], ["ū", "ऊ", "ू"], ["R", "ऋ", "ृ"], ["ṛ", "ऋ", "ृ"], ["ṝ", "ॠ", "ॄ"], ["ḷ", "ऌ", "ॢ"],
    ["e", "ए", "े"], ["ē", "ए", "े"], ["o", "ओ", "ो"], ["ō", "ओ", "ो"]];
  const C = [["kh", "ख"], ["gh", "घ"], ["ch", "छ"], ["jh", "झ"], ["Th", "ठ"], ["ṭh", "ठ"], ["Dh", "ढ"], ["ḍh", "ढ"], ["th", "थ"], ["dh", "ध"],
    ["ph", "फ"], ["bh", "भ"], ["sh", "श"], ["Sh", "ष"], ["k", "क"], ["g", "ग"], ["G", "ङ"], ["ṅ", "ङ"], ["c", "च"], ["j", "ज"], ["J", "ञ"], ["ñ", "ञ"],
    ["T", "ट"], ["ṭ", "ट"], ["D", "ड"], ["ḍ", "ड"], ["N", "ण"], ["ṇ", "ण"], ["t", "त"], ["d", "द"], ["n", "न"], ["p", "प"], ["b", "ब"], ["m", "म"],
    ["y", "य"], ["r", "र"], ["l", "ल"], ["v", "व"], ["w", "व"], ["z", "श"], ["ś", "श"], ["S", "ष"], ["ṣ", "ष"], ["s", "स"], ["h", "ह"], ["L", "ळ"], ["ḻ", "ळ"]];
  const O = [["OM", "ॐ"], ["M", "ं"], ["ṃ", "ं"], ["ṁ", "ं"], ["H", "ः"], ["ḥ", "ः"], ["m̐", "ँ"], ["~", "ँ"], ["'", "ऽ"], ["’", "ऽ"], ["||", "॥"], ["|", "।"],
    ..."0123456789".split("").map((d) => [d, "०१२३४५६७८९"[d]])];
  const T = [...V.map(([k, i, m]) => [k.normalize("NFC"), "v", i, m]), ...C.map(([k, c]) => [k.normalize("NFC"), "c", c]), ...O.map(([k, o]) => [k.normalize("NFC"), "o", o])]
    .sort((a, b) => b[0].length - a[0].length);
  return (s) => {
    s = s.normalize("NFC");
    let out = "", afterC = false;
    for (let i = 0; i < s.length;) {
      const t = T.find(([k]) => s.startsWith(k, i));
      if (t && t[1] === "c") { if (afterC) out += "्"; out += t[2]; afterC = true; }
      else if (t && t[1] === "v") { out += afterC ? t[3] : t[2]; afterC = false; }
      else { if (afterC) out += "्"; out += t ? t[2] : s[i]; afterC = false; }
      i += t ? t[0].length : 1;
    }
    return afterC ? out + "्" : out;
  };
})();

// Look-alikes that are never right in the text: a vertical bar for a daṇḍa (fixed as you type),
// Latin digits inside verse numbers (fixed on save).
const fixBars = (s) => s.replace(/\|\|/g, "॥").replace(/\|/g, "।").replace(/।।/g, "॥");
const fixVerseDigits = (s) => s.replace(/([।॥])([^।॥\n]{0,12}?)॥/g, (m, a, mid) => a + mid.replace(/[0-9]/g, (d) => "०१२३४५६७८९"[d]) + "॥");

// The Tesseract result with line boxes; the nth non-blank text line maps to its nth line.
function tessLines() {
  for (const [l, r] of Object.entries(S.data.results)) if (l.startsWith("tesseract") && r.lines && r.lines.length && r.lines[0].bbox) return r.lines;
  return [];
}

const PALETTE = ["ऽ", "।", "॥", "्", "ं", "ँ", "ः", "ॐ", "०", "१", "२", "३", "४", "५", "६", "७", "८", "९", "—"];

function renderEdit() {
  const res = S.data.results;
  const src = res.groundtruth ? "groundtruth" : $("engA").value;
  const draftKey = `draft:${S.work}/${S.page}`;
  let draft = null; try { draft = JSON.parse(store.get(draftKey) || "null"); } catch {}
  const rv = (res.groundtruth && res.groundtruth.review) || {};
  const restored = draft && draft.text !== res[src].text;
  $("textpane").innerHTML = `
    <div class="meta"><span>${res.groundtruth ? "Editing the saved ground truth" : `No ground truth yet; starting from <b>${esc(src)}</b>`}</span></div>
    <p class="muted" style="font-size:13px;margin-top:0">Type what is printed, one printed line per line, blank line between paragraphs. Keep headers, footnote markers and signature marks.</p>
    ${restored ? `<div class="draftnote">Restored your unsaved edits from ${esc(new Date(draft.at).toLocaleString())}. <button id="discard">Discard them</button></div>` : ""}
    <div class="pal" id="pal">${PALETTE.map((c) => `<button class="deva" data-c="${c}" title="insert ${c}">${c}</button>`).join("")}</div>
    <div class="rom"><input id="rom" placeholder="romanised (IAST kṛṣṇa or Harvard-Kyoto kRSNa), Enter inserts" autocomplete="off" spellcheck="false"><span id="romout" class="deva"></span></div>
    <div class="ed"><div id="hl" class="deva" aria-hidden="true"></div><textarea id="gt" class="deva" spellcheck="false" wrap="off"></textarea></div>
    <p class="keys muted"><span class="ln low" style="padding:0 4px">yellow</span> Tesseract was unsure · <kbd>F2</kbd> or <kbd>Alt ↓</kbd> next unsure line, with <kbd>Shift</kbd> / <kbd>Alt ↑</kbd> previous · <kbd>⌘/Ctrl S</kbd> save · <kbd>⌘/Ctrl ↵</kbd> save and next page · edits are kept in this browser until saved</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;align-items:center">
      <label><input type="checkbox" id="verified"> I checked every line against the print (verified)</label>
      <input id="note" placeholder="note for the next reviewer (optional)" style="flex:1;min-width:200px">
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button id="save">Save</button><button id="savenext">Save and next ▶</button><span id="saved" class="muted">${esc(S.flash || "")}</span></div>
    ${rv.saved ? `<p class="muted" style="font-size:13px">Last saved by ${esc(rv.reviewer || "unknown")} on ${esc(rv.saved.slice(0, 10))}${rv.verified ? " · verified" : " · draft"}${rv.note ? " · note: " + esc(rv.note) : ""}</p>` : ""}`;
  S.flash = "";
  const ta = $("gt"), hl = $("hl"), TL = tessLines();
  ta.value = restored ? draft.text : res[src].text;
  $("verified").checked = restored ? !!draft.verified : !!rv.verified;
  $("note").value = restored ? draft.note || "" : rv.note || "";

  const rows = () => { let k = -1; return ta.value.split("\n").map((t) => ({ t, k: t.trim() ? ++k : null })); };
  const curRow = () => ta.value.slice(0, ta.selectionStart).split("\n").length - 1;
  const tl = (r) => (r && r.k != null ? TL[r.k] : null);
  const isLow = (r) => { const x = tl(r); return !!x && x.conf < LOW; };
  const sync = () => { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; };
  function paint(follow = true) {
    const rs = rows(), c = curRow();
    hl.innerHTML = rs.map((r, i) => `<div class="${[isLow(r) ? "lowl" : "", i === c ? "cur" : ""].join(" ").trim()}">${esc(r.t) || " "}</div>`).join("");
    sync();
    if (!follow) return;
    const x = tl(rs[c]);
    if (x) { showBox(x.bbox); scrollToBox(x.bbox); } else $("box").style.display = "none";
  }
  const keepDraft = () => store.set(draftKey, JSON.stringify({ text: ta.value, verified: $("verified").checked, note: $("note").value, at: new Date().toISOString() }));
  function onInput() {
    if (ta.value.includes("|") || ta.value.includes("।।")) {
      const p = ta.selectionStart, before = fixBars(ta.value.slice(0, p));
      ta.value = before + fixBars(ta.value.slice(p));
      ta.selectionStart = ta.selectionEnd = before.length;
    }
    keepDraft(); paint();
  }
  function insert(s) { ta.setRangeText(s, ta.selectionStart, ta.selectionEnd, "end"); onInput(); }
  function jump(dir) {
    const rs = rows();
    for (let i = curRow() + dir; i >= 0 && i < rs.length; i += dir) {
      if (!isLow(rs[i])) continue;
      const start = rs.slice(0, i).reduce((n, r) => n + r.t.length + 1, 0);
      ta.focus(); ta.setSelectionRange(start, start + rs[i].t.length);
      ta.scrollTop = Math.max(0, i * parseFloat(getComputedStyle(ta).lineHeight) - ta.clientHeight / 3);
      paint(); return;
    }
    $("saved").textContent = dir > 0 ? "No more unsure lines below." : "No more unsure lines above.";
  }
  async function save(next) {
    const text = fixVerseDigits(ta.value), fixed = text !== ta.value;
    try {
      const r = await api(`/api/${S.work}/${S.page}/groundtruth`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, verified: $("verified").checked, note: $("note").value }) });
      store.del(draftKey);
      S.flash = `Saved p${S.page} to ${r.saved}` + (fixed ? " (verse numbers changed to Devanagari digits)" : "");
      const i = S.pages.findIndex((p) => p.page === S.page), n = next ? S.pages[i + 1] : null;
      if (next && !n) S.flash += " · this was the last page";
      await loadPage(n ? n.page : S.page); // still in Proofread mode, so this redraws the editor
    } catch (e) { $("saved").textContent = "Save failed: " + e.message + " (your edits are still kept in this browser)"; }
  }

  ta.addEventListener("input", onInput);
  ta.addEventListener("keyup", () => paint());
  ta.addEventListener("click", () => paint());
  ta.addEventListener("scroll", sync);
  $("verified").onchange = keepDraft;
  $("note").oninput = keepDraft;
  $("pal").addEventListener("mousedown", (e) => e.preventDefault()); // keep the cursor in the text
  $("pal").onclick = (e) => { const b = e.target.closest("button[data-c]"); if (b) insert(b.dataset.c); };
  $("rom").oninput = () => ($("romout").textContent = translit($("rom").value));
  $("rom").onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); if ($("rom").value) insert(translit($("rom").value)); $("rom").value = ""; $("romout").textContent = ""; }
    if (e.key === "Escape") ta.focus();
  };
  $("save").onclick = () => save(false);
  $("savenext").onclick = () => save(true);
  if (restored) $("discard").onclick = () => { store.del(draftKey); renderEdit(); };
  S.edit = { save, jump };
  paint(false);
}

document.addEventListener("keydown", (e) => {
  if (S.mode !== "edit" || !S.edit) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); S.edit.save(false); }
  else if (mod && e.key === "Enter") { e.preventDefault(); S.edit.save(true); }
  else if (e.key === "F2") { e.preventDefault(); S.edit.jump(e.shiftKey ? -1 : 1); }
  else if (e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); S.edit.jump(e.key === "ArrowDown" ? 1 : -1); }
});

// ---- Suggestions: fixes learned from corrections, offered everywhere else in the book ----
const SG = { rule: "", items: [], i: 0, rules: [] };

async function renderSugg() {
  const pane = $("textpane");
  pane.innerHTML = `<p class="muted">Loading suggestions…</p>`;
  const pr = await api(`/api/${S.work}/patterns`);
  SG.rules = pr.rules.sort((a, b) => (b.pending - a.pending) || (b.count - a.count));
  SG.items = await api(`/api/${S.work}/suggestions${SG.rule ? "?rule=" + encodeURIComponent(SG.rule) : ""}`);
  SG.i = Math.min(SG.i, Math.max(0, SG.items.length - 1));
  const on = SG.rules.filter((r) => r.enabled);
  const ruleOpt = (r) => `<option value="${esc(r.id)}"${r.id === SG.rule ? " selected" : ""}>${esc(r.from)} → ${esc(r.to)} (${r.pending})</option>`;
  const row = (r) => `<tr><td><input type="checkbox" data-rule="${esc(r.id)}"${r.enabled ? " checked" : ""} title="use this rule"></td>
    <td class="deva" style="font-size:15px">${esc(r.from)} → ${esc(r.to)}</td><td class="muted">${esc(r.kind)}${r.source !== "mined" ? " · " + esc(r.source) : ""}</td>
    <td>seen ${r.count}×</td><td>${r.pending} pending</td><td class="muted">${esc(r.note || "")}</td></tr>`;
  pane.innerHTML = `
    <div class="meta"><span><b>${SG.items.length}${SG.items.length >= 300 ? "+" : ""}</b> suggestions from ${on.length} rules in use</span>
      <span class="muted">${pr.decided} decided so far</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">
      <select id="sgrule"><option value="">all rules in use</option>${on.map(ruleOpt).join("")}</select>
      <button id="sgall" ${SG.rule && SG.items.length ? "" : "disabled"} title="accept every suggestion shown for this rule">Accept all shown</button>
      <button id="sgmine" title="learn rules from the pages corrected so far">Learn from corrections</button>
      <label class="muted" style="font-size:13px"><input type="checkbox" id="sgclaude"> include Claude's reviews</label>
    </div>
    <p class="keys muted"><kbd>j</kbd>/<kbd>↓</kbd> next · <kbd>k</kbd>/<kbd>↑</kbd> previous · <kbd>a</kbd> accept · <kbd>r</kbd> reject · <kbd>o</kbd> open the page in Proofread.
      Accepting changes only that page's draft; nothing is marked verified. Reject anything that is printed that way.</p>
    <div id="sglist"></div>
    <details style="margin-top:14px"><summary>${SG.rules.length} rules (${on.length} in use)</summary>
      <p class="muted" style="font-size:12px">Word rules match whole words; fragment rules match inside words and can be too broad, so they start off.
      Claude can add rules from a session with <code>uv run amocr rule add</code>.</p>
      <table class="rules">${SG.rules.map(row).join("")}</table></details>`;
  $("sgrule").onchange = () => { SG.rule = $("sgrule").value; SG.i = 0; renderSugg(); };
  $("sgmine").onclick = async () => { await api(`/api/${S.work}/patterns/mine`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ include_claude: $("sgclaude").checked }) }); renderSugg(); };
  $("sgall").onclick = () => { if (confirm(`Accept all ${SG.items.length} shown?`)) sgDecide(SG.items.slice(), true); };
  pane.querySelectorAll("input[data-rule]").forEach((cb) => (cb.onchange = async () => {
    await api(`/api/${S.work}/patterns/${cb.dataset.rule}/enabled`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: cb.checked }) });
    renderSugg();
  }));
  sgList();
}

function sgList() {
  const box = $("sglist");
  if (!SG.items.length) { box.innerHTML = `<p class="muted">Nothing to review. Correct some pages in Proofread, then press "Learn from corrections".</p>`; return; }
  box.innerHTML = SG.items.map((s, i) => {
    const line = esc(s.line.slice(0, s.start)) + `<del>${esc(s.from)}</del><ins>${esc(s.to)}</ins>` + esc(s.line.slice(s.end));
    const img = s.bbox && Math.abs(i - SG.i) < 6 ? `<img loading="lazy" alt="line ${s.n} on page ${s.page}" src="/crop/${S.work}/${s.page}?b=${s.bbox.join(",")}">` : "";
    return `<div class="sg${i === SG.i ? " cur" : ""}" data-i="${i}"><span class="muted" style="font-size:12px">p${s.page} · line ${s.n}${s.source === "groundtruth" ? " · draft" : ""}</span>
      ${img}<div class="deva">${line}</div>
      <div style="display:flex;gap:6px;margin-top:4px"><button data-a="1">Accept</button><button data-a="0">Reject</button></div></div>`;
  }).join("");
  box.querySelectorAll(".sg").forEach((el) => {
    el.onclick = (e) => {
      const i = +el.dataset.i, b = e.target.closest("button");
      if (b) sgDecide([SG.items[i]], b.dataset.a === "1"); else sgSelect(i);
    };
  });
  sgSelect(SG.i, false);
}

function sgSelect(i, rerender = true) {
  if (!SG.items.length) return;
  SG.i = Math.max(0, Math.min(i, SG.items.length - 1));
  if (rerender) return sgList();
  const s = SG.items[SG.i], el = document.querySelector(`.sg[data-i="${SG.i}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
  const img = $("img"), src = `/img/${S.work}/${s.page}`;
  const mark = () => { if (s.bbox) { showBox(s.bbox); scrollToBox(s.bbox); } };
  if (!img.src.endsWith(src)) { img.onload = () => { img.onload = null; mark(); }; img.src = src; } else mark();
}

async function sgDecide(items, accept) {
  try {
    await api(`/api/${S.work}/suggestions/decide`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items, accept }) });
  } catch (e) { alert("Could not save: " + e.message); }
  const gone = new Set(items.map((x) => x.id));
  SG.items = SG.items.filter((x) => !gone.has(x.id));
  if (accept) { // other suggestions on the same line now point at old text: refresh them
    const pages = new Set(items.map((x) => x.page));
    if (SG.items.some((x) => pages.has(x.page))) return renderSugg();
  }
  sgSelect(SG.i);
}

document.addEventListener("keydown", (e) => {
  if (S.mode !== "sugg" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
  const s = SG.items[SG.i];
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); sgSelect(SG.i + 1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); sgSelect(SG.i - 1); }
  else if (s && e.key === "a") sgDecide([s], true);
  else if (s && e.key === "r") sgDecide([s], false);
  else if (s && e.key === "o") { const p = s.page; setMode("edit"); loadPage(p); }
});

function render() {
  if (!S.data) return;
  S.edit = null;
  const diff = S.mode === "diff";
  $("vs").style.display = $("engB").style.display = diff ? "" : "none";
  $("engA").style.display = S.mode === "edit" || S.mode === "sugg" ? "none" : "";
  if (S.mode === "sugg") return renderSugg().catch((e) => { $("textpane").innerHTML = `<p>Could not load suggestions: ${esc(e.message)}</p>`; });
  const nGt = S.pages.filter((p) => p.groundtruth).length;
  $("status").textContent = `${S.pages.length} pages with output · ${nGt} with ground truth`;
  if (S.mode === "view") renderView($("engA").value);
  else if (diff) renderDiff($("engA").value, $("engB").value);
  else renderEdit();
}

init().catch((e) => { $("textpane").innerHTML = `<p>Could not load: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
