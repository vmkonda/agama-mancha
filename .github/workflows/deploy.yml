name: deploy

# Pushing to the `deploy` branch updates the VPS: the tests run first, then the server pulls that
# commit and restarts (scripts/linux/deploy.sh). To release what's on main:
#   git push origin main:deploy
# To roll back, force-push an older commit:  git push -f origin <commit>:deploy
# Setup, secrets and the server side: docs/deploy-vps.md.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # never cut a deploy off halfway; the next one waits

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production     # its secrets, and (optionally) required reviewers, live here
    steps:
      - name: Update the server
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts      # the server's host key, pinned
          # The key on the server is restricted to running scripts/linux/deploy.sh (a forced command),
          # so what's sent here is ignored; the server always deploys its deploy branch.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$USER@$HOST" deploy
      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
