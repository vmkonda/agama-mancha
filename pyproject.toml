[project]
name = "agama-mancha"
version = "0.1.0"
description = "OCR step of the Agama Mancha library: scanned Sanskrit/Hindi books to page-level text with confidence and provenance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# Local Surya OCR engine. Code Apache-2.0; model weights under a modified OpenRAIL-M licence (docs/engines.md).
surya = ["surya-ocr>=0.24,<0.25"]
# The librarian (index + MCP tool over the library): docs/librarian.md.
librarian = ["lancedb>=0.13", "pyarrow>=15", "mcp>=2.0"]

[project.scripts]
amocr = "amocr.cli:main"
librarian = "librarian.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amocr", "src/librarian"]
